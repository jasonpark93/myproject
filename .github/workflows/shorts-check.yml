# 대본 PR을 고칠 때마다 형식 오류가 없는지 검사한다.
name: 쇼츠 대본 검사

on:
  pull_request:
    paths:
      - "shorts/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shorts
    steps:
      - uses: actions/checkout@v6

      - name: ffmpeg·한글 폰트 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: shorts/requirements*.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 테스트
        run: python -m pytest -q

      - name: 대본 검사
        run: python -m studio check
